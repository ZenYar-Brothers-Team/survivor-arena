<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Survivor Arena — арт атак боссов</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #17131b; color: #f2e9dc; }
    body { margin: 0; padding: 24px; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { margin: 0 0 22px; color: #cdbfd0; max-width: 900px; }
    main { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; }
    figure { margin: 0; padding: 14px; border: 1px solid #4f3d55; border-radius: 14px; background: #211a26; }
    .checker { border-radius: 10px; background-color: #342a38; background-image: linear-gradient(45deg,#443648 25%,transparent 25%),linear-gradient(-45deg,#443648 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#443648 75%),linear-gradient(-45deg,transparent 75%,#443648 75%); background-size: 24px 24px; background-position: 0 0,0 12px,12px -12px,-12px 0; }
    img { display: block; width: 100%; aspect-ratio: 1; object-fit: contain; }
    figcaption { margin-top: 10px; line-height: 1.35; }
    strong { color: #ff8c82; }
    small { color: #baaabd; }
  </style>
</head>
<body>
  <h1>Кандидаты projectile-арта — FIELD-002…010</h1>
  <p>Каждый спрайт предназначен для совместного использования final boss и midboss своего поля. Зоны и лучи остаются процедурными. Файлы — preview, в runtime не подключены.</p>
  <main>
    <figure><div class="checker"><img src="field-002-projectile-candidate-01.png" alt="FIELD-002"></div><figcaption><strong>FIELD-002</strong><br><small>Капитан / сержант стражи — тяжёлый щитовой сердечник</small></figcaption></figure>
    <figure><div class="checker"><img src="field-003-projectile-candidate-01.png" alt="FIELD-003"></div><figcaption><strong>FIELD-003</strong><br><small>Главный ловчий / следопыт — капканный арбалетный наконечник</small></figcaption></figure>
    <figure><div class="checker"><img src="field-004-projectile-candidate-01.png" alt="FIELD-004"></div><figcaption><strong>FIELD-004</strong><br><small>Рыцарь знамени — геральдический жетон</small></figcaption></figure>
    <figure><div class="checker"><img src="field-005-projectile-candidate-01.png" alt="FIELD-005"></div><figcaption><strong>FIELD-005</strong><br><small>Инквизитор / капитан — реликварная печать</small></figcaption></figure>
    <figure><div class="checker"><img src="field-006-projectile-candidate-01.png" alt="FIELD-006"></div><figcaption><strong>FIELD-006</strong><br><small>Архимаг / маг-наблюдатель — астролябическая сфера</small></figcaption></figure>
    <figure><div class="checker"><img src="field-007-projectile-candidate-01.png" alt="FIELD-007"></div><figcaption><strong>FIELD-007</strong><br><small>Паладины — тяжёлый заряд небесного молота</small></figcaption></figure>
    <figure><div class="checker"><img src="field-008-projectile-candidate-01.png" alt="FIELD-008"></div><figcaption><strong>FIELD-008</strong><br><small>Чемпион / рыцарь короны — коронный клинковый жетон</small></figcaption></figure>
    <figure><div class="checker"><img src="field-009-projectile-candidate-01.png" alt="FIELD-009"></div><figcaption><strong>FIELD-009</strong><br><small>Серафим / вестник — небесный наконечник</small></figcaption></figure>
    <figure><div class="checker"><img src="field-010-projectile-candidate-01.png" alt="FIELD-010"></div><figcaption><strong>FIELD-010</strong><br><small>Архангел / предвестник — звезда Суда</small></figcaption></figure>
  </main>
</body>
</html>
