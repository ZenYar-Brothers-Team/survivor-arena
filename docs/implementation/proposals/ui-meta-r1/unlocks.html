<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Открытия — Полевой фолиант</title>
<style>
@font-face{font-family:Folio;src:url('/Assets/Game/UI/Fonts/AlegreyaSans-Medium.ttf')}@font-face{font-family:Text;src:url('/Assets/Game/UI/Fonts/PTSans-Regular.ttf')}
:root{color-scheme:dark;--paper:#e8d8b8;--muted:#bfaeaa;--gold:#d5a84a;--line:#615065;--panel:#302936;--green:#adc58e}*{box-sizing:border-box}body{margin:0;background:#1c1821;color:var(--paper);font:20px Text,sans-serif}button,select{font:inherit;color:inherit}button{cursor:pointer;background:#493d4e;border:1px solid #806773;border-bottom:3px solid #211925;border-radius:5px;padding:9px 20px}button:hover:not(:disabled){background:#5c495b;border-color:var(--paper)}button:focus-visible,select:focus-visible,[tabindex]:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}button:disabled{opacity:.5;cursor:default}select{background:#403746;padding:6px;border:1px solid var(--line)}.tools{padding:12px 20px;display:flex;gap:24px;align-items:center;font-size:14px}.tools strong{color:var(--gold)}.note{margin:0 20px 12px;color:var(--muted);font-size:14px}#stage{position:relative;margin:auto}#viewport{position:absolute;transform-origin:top left;width:1920px;height:1080px;background:#241f2b;display:grid;place-items:center}.panel{width:1720px;height:1000px;background:var(--panel);border:2px solid #645263;border-radius:14px;padding:24px 40px;display:flex;flex-direction:column}h1,h2,h3,p{margin:0}h1,h2,h3{font-family:Folio;font-weight:500}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:52px;color:var(--gold)}.wallet{font-size:32px;color:var(--gold)}.tabs{display:flex;gap:36px;border-bottom:1px solid var(--line);margin-top:4px}.tabs a,.tabs span{font-size:27px;padding:8px 0;color:var(--muted);text-decoration:none}.tabs span{color:var(--paper);border-bottom:3px solid var(--gold)}.filters{display:flex;align-items:center;gap:9px;padding:18px 0;flex-shrink:0}.filters button{background:none;border-color:transparent;padding:8px 16px;color:var(--muted)}.filters button[aria-pressed=true]{color:var(--paper);background:#493d4e;border-color:#806773}.filters select{margin-left:auto;font-size:20px}.scroll{flex:1;min-height:0;overflow-y:auto;scrollbar-color:#957d91 #241b2b;padding:0 16px 0 2px}.group{margin:4px 0 27px}.group-head{display:flex;align-items:baseline;gap:15px;margin:0 0 13px}.group-head h2{font-size:31px}.group-head small{font-size:18px;color:var(--muted)}.rows{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.entry{min-width:0;display:flex;gap:16px;align-items:center;padding:14px;background:#39303f;border:1px solid #645163;border-radius:7px;min-height:124px}.entry.available{border-color:#a98b50;background:#403739}.art{width:82px;height:82px;flex-shrink:0;display:grid;place-items:center;position:relative}.art img{width:100%;height:100%;object-fit:contain}.art.silhouette img{filter:brightness(0);opacity:.85}.art.silhouette::after{content:'?';position:absolute;color:var(--paper);font-size:28px;bottom:0;right:2px}.map{width:64px;height:64px;border:1px solid #957d91;border-radius:6px;font:32px Folio;color:var(--gold);display:grid;place-items:center;transform:rotate(-4deg)}.copy{min-width:0;flex:1}.kind{color:var(--muted);font-size:15px;letter-spacing:.6px}.copy h3{font-size:26px;line-height:1.1;margin:3px 0 7px;overflow-wrap:anywhere}.state{font-size:18px;color:var(--muted);line-height:1.2}.state.owned{color:var(--green)}.purchase{display:flex;align-items:center;gap:12px;margin-top:9px}.purchase button{font-size:18px;padding:6px 13px;background:#a65f43}.price{font-size:18px;color:var(--gold)}footer{display:flex;align-items:center;gap:25px;justify-content:space-between;border-top:1px solid var(--line);padding-top:15px;margin-top:12px;flex-shrink:0}footer a{color:var(--paper);text-decoration:none;border:1px solid #806773;border-bottom:3px solid #211925;border-radius:5px;background:#493d4e;padding:9px 24px}#feedback{flex:1;color:var(--green);font-size:18px}#total{font-size:19px;color:var(--muted)}.empty{padding:70px 10px;color:var(--muted);text-align:center}.compact .panel{width:1200px;height:688px;padding:14px 24px}.compact h1{font-size:36px}.compact .wallet{font-size:25px}.compact .tabs{gap:26px}.compact .tabs a,.compact .tabs span{font-size:21px;padding:6px 0}.compact .filters{padding:11px 0;gap:5px}.compact .filters button{font-size:17px;padding:6px 12px}.compact .filters select{font-size:17px}.compact .rows{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.compact .entry{min-height:100px;padding:10px;gap:12px}.compact .art{width:62px;height:62px}.compact .copy h3{font-size:23px;margin:2px 0 5px}.compact .kind{font-size:13px}.compact .state,.compact .price{font-size:16px}.compact .purchase{margin-top:6px}.compact .purchase button{font-size:16px;padding:4px 10px}.compact .group{margin-bottom:18px}.compact .group-head{margin-bottom:9px}.compact .group-head h2{font-size:26px}.compact .group-head small{font-size:16px}.compact footer{padding-top:11px;margin-top:9px;font-size:18px}.compact #total,.compact #feedback{font-size:16px}[hidden]{display:none!important}
</style>
<body>
<div class="tools"><strong>МАКЕТ · ОТКРЫТИЯ</strong><label>Размер <select id="resolution"><option value="1920">1920 × 1080</option><option value="1280">1280 × 720</option></select></label><label>Профиль <select id="scenario"><option value="progress">Пройдена первая карта</option><option value="new">Новый профиль</option><option value="poor">Нет золота</option><option value="all">Всё открыто · проверка списка</option><option value="error">Ошибка покупки</option></select></label></div>
<p class="note">Предложение интерфейса · реальные названия, цены и условия · демонстрационные покупки без сохранения. Номера карт — временное оформление без нового арта.</p>
<div id="stage"><div id="viewport"><section class="panel"><header><h1>Развитие</h1><div class="wallet"><span id="wallet">—</span> золота</div></header>
<nav class="tabs" aria-label="Развитие"><a href="/docs/implementation/proposals/ui-meta-r1/index.html">Улучшения</a><span aria-current="page">Открытия</span></nav>
<div class="filters" aria-label="Фильтры коллекции"><button data-type="all" aria-pressed="true">Все</button><button data-type="character" aria-pressed="false">Персонажи</button><button data-type="field" aria-pressed="false">Карты</button><button data-type="ability" aria-pressed="false">Умения</button><button data-type="set" aria-pressed="false">Сеты</button><select id="state" aria-label="Состояние открытия"><option value="all">Все состояния</option><option value="locked">Не открыто</option><option value="available">Можно купить</option><option value="owned">Открыто</option></select></div>
<main id="collection" class="scroll" tabindex="0" aria-label="Коллекция открытий"></main>
<footer><a href="/docs/implementation/proposals/ui-meta-r1/index.html">Назад к улучшениям</a><span id="feedback" role="status"></span><span id="total"></span></footer>
</section></div></div>
<script>
const $=id=>document.getElementById(id), fmt=n=>n.toLocaleString('ru-RU');
let rules=[],byId={},owned=new Set(),cleared=new Set(),wallet=650,type='all',pending=false;
const kinds={character:'Персонаж',field:'Карта',skill:'Активное',passive:'Пассивное',set:'Сет'};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function condition(r){return r.condition==='initial'||r.condition==='fieldClear'&&cleared.has(r.requiredId)||r.condition==='access'&&owned.has(r.requiredId)||r.condition==='firstRun'&&cleared.size>0;}
function resolve(){let change=true;while(change){change=false;for(const r of rules)if(!r.price&&!owned.has(r.id)&&condition(r)){owned.add(r.id);change=true;}}}
function seed(){const mode=$('scenario').value;owned=new Set(rules.filter(r=>r.condition==='initial').map(r=>r.id));cleared=new Set(mode==='new'?[]:['FIELD-001']);wallet=mode==='poor'?0:650;if(mode==='all')owned=new Set(rules.map(r=>r.id));resolve();$('feedback').textContent='';render();$('collection').scrollTop=0;}
function art(r,hidden){const id=r.id==='CHAR-001'?'fixture-character-agile':r.id.toLowerCase();if(r.kind==='field')return `<div class="art" aria-hidden="true"><span class="map">${Number(r.id.split('-')[1])}</span></div>`;const folder={skill:'Skills',passive:'Passives',set:'Sets'}[r.kind];const src=r.kind==='character'?`/Assets/Resources/Art/Sprites/Characters/${id}/${id}-body.png`:`/Assets/Resources/Art/UI/Icons/${folder}/${id}-icon.png`;return `<div class="art ${hidden?'silhouette':''}" aria-hidden="true"><img src="${src}" alt=""></div>`;}
function hint(r){if(owned.has(r.id))return '✓ Открыто';if(condition(r))return wallet<r.price?'Не хватает золота':'Можно открыть';const name=byId[r.requiredId]?.name||'';return r.condition==='access'?'Открыть карту «'+name+'»':r.condition==='fieldClear'?'Пройти «'+name+'»':r.condition==='firstRun'?'Завершить первый забег':'Недоступно';}
function visible(r){const s=$('state').value;return(type==='all'||r.kind===type||type==='ability'&&['skill','passive'].includes(r.kind))&&(s==='all'||s==='owned'&&owned.has(r.id)||s==='locked'&&!owned.has(r.id)||s==='available'&&!owned.has(r.id)&&r.price>0&&condition(r)&&wallet>=r.price);}
function row(r){const yes=owned.has(r.id), hidden=r.kind==='character'&&!yes,buy=!yes&&r.price>0,available=buy&&condition(r)&&wallet>=r.price;return `<article class="entry ${available?'available':''}" data-id="${r.id}">${art(r,hidden)}<div class="copy"><div class="kind">${kinds[r.kind]}</div><h3>${hidden?'?':esc(r.name)}</h3><div class="state ${yes?'owned':''}">${esc(hint(r))}</div>${buy?`<div class="purchase"><span class="price">${fmt(r.price)} золота</span><button data-buy="${r.id}" ${!available||pending?'disabled':''} aria-label="Открыть неизвестного персонажа за ${r.price} золота">${pending?'Подождите':'Открыть'}</button></div>`:''}</div></article>`;}
function render(){const offset=$('collection').scrollTop;const filtered=rules.filter(visible),groups=[];for(const [key,title]of [['character','Персонажи'],['field','Карты']]){const items=filtered.filter(r=>r.kind===key);if(items.length)groups.push([title,items]);}const content=filtered.filter(r=>!['character','field'].includes(r.kind));for(const key of ['initial',...rules.filter(r=>r.kind==='field').map(r=>r.id)]){const items=content.filter(r=>(r.requiredId||'initial')===key);if(items.length)groups.push([key==='initial'?'Доступно с начала':'За прохождение · '+byId[key].name,items]);}$('collection').innerHTML=groups.length?groups.map(([title,items])=>`<section class="group"><div class="group-head"><h2>${esc(title)}</h2><small>${items.filter(r=>owned.has(r.id)).length} / ${items.length} открыто</small></div><div class="rows">${items.map(row).join('')}</div></section>`).join(''):'<p class="empty">Под этот фильтр пока ничего не подходит.</p>';$('collection').scrollTop=offset;$('wallet').textContent=fmt(wallet);$('total').textContent=`Открыто ${owned.size} / ${rules.length} · показано ${filtered.length}`;document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>purchase(b.dataset.buy));fit();}
async function purchase(id){const r=byId[id];if(pending||owned.has(id)||!condition(r)||wallet<r.price)return;pending=true;render();$('scenario').disabled=true;$('feedback').textContent='Сохраняем… · макет';await new Promise(resolve=>setTimeout(resolve,650));if($('scenario').value==='error'){$('feedback').textContent='Не удалось сохранить. Золото не списано — попробуйте снова.';}else{wallet-=r.price;owned.add(id);resolve();$('feedback').textContent=r.name+' — открыто';}pending=false;$('scenario').disabled=false;render();const retry=document.querySelector(`[data-buy="${id}"]`);if(retry&&!retry.disabled)retry.focus();else $('collection').focus();}
function fit(){const w=+$('resolution').value,h=w*9/16,s=Math.min(1,(innerWidth-24)/w,Math.max(180,innerHeight-$('stage').getBoundingClientRect().top-12)/h);Object.assign($('viewport').style,{width:w+'px',height:h+'px',transform:`scale(${s})`});$('viewport').classList.toggle('compact',w===1280);Object.assign($('stage').style,{width:w*s+'px',height:h*s+'px'});}
document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{type=b.dataset.type;document.querySelectorAll('[data-type]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render();$('collection').scrollTop=0;});$('state').onchange=()=>{render();$('collection').scrollTop=0;};$('resolution').onchange=fit;$('scenario').onchange=seed;addEventListener('resize',fit);fetch('/catalog.json').then(r=>{if(!r.ok)throw Error('Каталог недоступен');return r.json()}).then(data=>{rules=data.unlocks;byId=Object.fromEntries(rules.map(r=>[r.id,r]));seed();}).catch(e=>{$('collection').textContent=e.message;fit();});
</script></body></html>
