rink:0;display:flex;flex-direction:column;text-align:center;border-right:1px solid var(--line);padding-right:30px}.hero select{width:100%;font-size:27px}.portrait{width:100%;height:300px;object-fit:contain;margin:14px 0}.hero h2{font-size:32px}.muted{color:var(--muted)}.hero p{font-size:20px;margin:8px 0}.hero .investment{margin-top:auto;text-align:left;border-top:1px solid var(--line);padding-top:18px}.investment strong{font-size:30px;color:var(--gold);display:block}.right{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}.switch{display:flex;align-items:center;gap:12px;margin-bottom:18px;font-size:20px}.switch input{width:20px;height:20px;accent-color:var(--gold)}.switch small{color:var(--muted);margin-left:auto}.scroll{overflow-y:auto;min-height:0;scrollbar-color:#957d91 #241b2b;padding-right:14px;flex:1}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{background:#39303f;border:1px solid #645163;border-top:2px solid #806878;padding:18px;min-width:0;border-radius:7px}.card-top{display:flex;gap:12px;align-items:center}.icon{width:60px;height:60px;object-fit:contain;flex-shrink:0}.symbol{display:grid;place-items:center;font:48px Folio;color:var(--gold)}h3{font-size:27px;line-height:1.05}.level{font-size:16px;color:var(--muted);margin-top:5px}.bars{display:flex;gap:4px;margin:16px 0 10px}.bars i{height:5px;background:#211c27;flex:1}.bars i.on{background:var(--gold)}.bonus{font-size:26px;display:flex;align-items:center;gap:10px}.bonus span{color:var(--muted);font-size:20px}.bonus strong{font-weight:400;color:#a8c18d}.card-bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:15px}.price{color:var(--gold);font-size:24px}.card button{font-size:19px;padding:8px 12px}.reason{height:20px;font-size:15px;color:var(--muted);margin-top:7px}.off .bonus{opacity:.55}footer{border-top:1px solid var(--line);padding-top:20px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-shrink:0}footer button{font-size:24px}.reset-group{display:flex;gap:20px;align-items:center}.reset-group small{font-size:17px;color:var(--muted)}#feedback{color:var(--muted);font-size:18px}.collection{width:100%;overflow-y:auto;scrollbar-color:#957d91 #241b2b}.collection h2{font-size:31px;margin:0 0 14px}.collection section{margin-bottom:30px}.entries{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.entry{display:flex;align-items:center;gap:14px;background:#39303f;padding:14px}.entry img{width:64px;height:64px;object-fit:contain}.entry small{display:block;color:var(--muted);font-size:18px}.locked{filter:brightness(0)}[hidden]{display:none!important}dialog{background:#302936;color:var(--paper);border:2px solid #957d91;border-radius:12px;width:510px;padding:30px;font:20px Text}dialog::backdrop{background:#140d19cc}dialog h2{font-size:34px;color:var(--gold)}dialog p{color:var(--muted);margin:12px 0 22px}dl{margin:16px 0 25px}dl div{display:flex;justify-content:space-between;padding:9px 0}dd{margin:0}.total{border-top:1px solid var(--line);color:var(--gold)}.dialog-actions{display:flex;justify-content:space-between;gap:15px}

/* Compact text-only upgrade cards; preserve the character portrait. */
.panel{height:1000px;padding:22px 40px 22px}
.eyebrow{display:none}h1{font-size:52px}
nav{margin-top:4px}nav button{padding:8px 0}
.main{padding:16px 0;gap:30px}
.switch{margin-bottom:12px}
.grid{gap:12px}
.card{padding:13px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:12px;align-content:start}
.card-top,.bars,.reason{grid-column:1/-1}
.card-top>div{display:flex;width:100%;justify-content:space-between;align-items:baseline;gap:10px}
.card-top h3{font-size:24px;line-height:1.1}

.bars{margin:7px 0 8px}
.bonus{font-size:24px;gap:7px;white-space:nowrap;grid-column:1/-1}
.bonus span{font-size:19px}
.card-bottom{margin:5px 0 0;gap:12px;justify-content:space-between;grid-column:1/-1}
.price{font-size:21px;white-space:nowrap}
.card button{font-size:18px;padding:7px 12px}
.reason{height:auto;margin-top:5px;line-height:18px}
.reason:empty{display:none}
footer{padding-top:14px}

.compact h1{font-size:36px}
.compact nav{margin-top:0}
.compact nav button{font-size:21px;padding:6px 0}
.compact .main{padding:12px 0;gap:20px}
.compact .switch{margin-bottom:9px}
.compact .grid{gap:10px}
.compact .card{padding:10px 12px;column-gap:8px}
.compact .card-top h3{font-size:21px}
.compact .level{font-size:13px;margin-top:0}
.compact .bars{margin:6px 0 7px}
.compact .bars i{height:4px}
.compact .bonus{font-size:20px;gap:5px}
.compact .bonus span{font-size:16px}
.compact .card-bottom{margin:4px 0 0;gap:9px}
.compact .price{font-size:18px}
.compact .card button{font-size:16px;padding:6px 9px}
.compact .reason{font-size:13px;line-height:16px}

.hero{min-height:0}
#hero-name{font-size:32px;line-height:1.1;flex-shrink:0}
.hero .portrait{height:260px;margin:6px 0 12px;flex-shrink:0}
.hero-roster{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-height:222px;min-height:0;overflow-y:auto;scrollbar-color:#957d91 #241b2b;padding:5px 9px 5px 5px;align-content:start}
.hero-choice{position:relative;aspect-ratio:1;padding:4px;background:#39303f;border:2px solid #645163;border-radius:6px}
.hero-choice img{width:100%;height:100%;object-fit:contain;display:block}
.hero-choice[aria-pressed=true]{border:3px solid var(--gold);background:#51443c}
.hero-choice[aria-pressed=true]::after{content:'✓';position:absolute;right:3px;bottom:0;font-size:17px;color:var(--gold)}
.hero .investment{flex-shrink:0;padding-top:12px}
.compact #hero-name{font-size:26px}

.compact .hero-roster{max-height:150px;gap:6px;padding-right:7px}

.compact .hero .investment{padding-top:9px}
</style><body><div class="tools"><strong>МАКЕТ · РАЗВИТИЕ</strong><label>Размер <select id="resolution"><option value="1920">1920 × 1080</option><option value="1280">1280 × 720</option></select></label><label>Состояние <select id="scenario"><option value="normal">Обычное</option><option value="poor">Не хватает на сброс</option><option value="exact">Сброс → 0 золота</option><option value="max">Максимум</option><option value="off">Бонусы отключены</option></select></label></div><p class="note">Демонстрационный профиль · покупки и сброс работают только внутри макета, без сохранения.</p><div id="stage"><div id="viewport"><section class="panel"><header><div><div class="eyebrow">Полевой фолиант</div><h1>Развитие</h1></div><div class="gold"><span id="wallet"></span><small>золота</small></div></header><nav role="tablist"><button role="tab" id="upgrades-tab" aria-selected="true">Улучшения</button><button role="tab" id="unlocks-tab" aria-selected="false">Открытия</button></nav><main class="main"><aside class="hero" id="hero-panel"><h2 id="hero-name"></h2><img id="portrait" class="portrait" alt=""><div class="hero-roster" role="group" aria-label="Выбор персонажа"><button class="hero-choice" data-hero="0" aria-label="Бугор" aria-pressed="true" title="Бугор"><img src="/Assets/Resources/Art/Sprites/Characters/char-002/char-002-body.png" alt=""></button><button class="hero-choice" data-hero="1" aria-label="Шепотка" aria-pressed="false" title="Шепотка"><img src="/Assets/Resources/Art/Sprites/Characters/char-003/char-003-body.png" alt=""></button></div><div class="investment"><span class="muted">Вложено</span><strong id="spent"></strong></div></aside><section class="right" id="upgrade-panel"><label class="switch"><input id="disabled-bonuses" type="checkbox">Без постоянных улучшений<small id="disabled-note">Бонусы со следующего забега</small></label><div class="scroll" tabindex="0" aria-label="Улучшения персонажа"><div class="grid" id="cards"></div></div></section><div id="collection" class="collection" tabindex="0" aria-label="Открытия" hidden></div></main><footer><button id="back">В меню</button><span id="feedback" role="status"></span><div class="reset-group" id="reset-group"><small id="reset-note">Комиссия 1 000 золотых</small><button id="reset">Вернуть вложения</button></div></footer></section></div></div><dialog id="confirm"><h2>Вернуть вложения?</h2><p id="reset-description"></p><dl><div><dt>Вернётся</dt><dd id="refund-value"></dd></div><div><dt>Комиссия</dt><dd>−1 000</dd></div><div class="total"><dt>Золото после сброса</dt><dd id="after-value"></dd></div></dl><div class="dialog-actions"><button id="cancel">Отмена</button><button class="primary" id="confirm-reset">Сбросить улучшения</button></div></dialog><script>
const $=id=>document.getElementById(id),fmt=n=>n.toLocaleString('ru-RU');
const defs=[['Здоровье',5,10,100,1],['Урон',3,10,100,4],['Размер предметов',4,10,150,12],['Скорость действий',3,10,200,5],['Регенерация',.05,10,200,2],['Скорость движения',3,10,150,3],['Перебросы',1,6,400,0,'↻'],['Исключения',1,6,300,0,'⊘'],['Радиус подбора опыта',10,10,100,7],['Опыт при подборе',3,10,200,10],['Снижение урона',2,10,200,8],['Эффективность лечения',5,10,100,9]];
let wallet=2450,levels=[],invested=[],active=0,tab='upgrades';const heroes=['Бугор','Шепотка'];
function seed(){const mode=$('scenario').value;wallet=2450;levels=[[3,2,1,2,0,1,1,0,2,0,0,1],Array(12).fill(0)];if(['poor','exact'].includes(mode)){levels=[Array(12).fill(0),Array(12).fill(0)];levels[0][0]=1;wallet=mode==='poor'?899:900;}if(mode==='max')levels[0]=defs.map(x=>x[2]);invested=levels.map(ls=>ls.reduce((s,l,i)=>s+defs[i][3]*l*(l+1)/2,0));active=0;$('disabled-bonuses').checked=mode==='off';render();}
function value(i,l){return i===4?'+'+(defs[i][1]*l).toFixed(2).replace('.',',')+' HP/с':i===6||i===7?'+'+l:'+'+(defs[i][1]*l)+(i===10?' п.п.':'%');}
function render(){$('hero-name').textContent=heroes[active];document.querySelectorAll('[data-hero]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.hero===active)));const off=$('disabled-bonuses').checked;$('wallet').textContent=fmt(wallet);$('spent').textContent=fmt(invested[active])+' золота';$('portrait').src='/Assets/Resources/Art/Sprites/Characters/char-00'+(active+2)+'/char-00'+(active+2)+'-body.png';$('disabled-note').textContent=off?'Бонусы не действуют · покупки сохраняются':'Бонусы со следующего забега';$('cards').classList.toggle('off',off);$('cards').innerHTML=defs.map((d,i)=>{const l=levels[active][i],max=l===d[2],price=d[3]*(l+1);return `<article class="card"><div class="card-top"><div><h3>${d[0]}</h3><div class="level">Уровень ${l} / ${d[2]}</div></div></div><div class="bars" aria-hidden="true">${Array.from({length:d[2]},(_,j)=>`<i class="${j<l?'on':''}"></i>`).join('')}</div><div class="bonus">${value(i,l)}${max?'':`<span>→</span><strong>${value(i,l+1)}</strong>`}</div><div class="card-bottom"><span class="price">${max?'Максимум':fmt(price)+' ◈'}</span><button class="primary" data-buy="${i}" ${max||wallet<price?'disabled':''} aria-label="Улучшить: ${d[0]}">Улучшить</button></div><div class="reason">${max?'Все уровни получены':wallet<price?'Не хватает золота':off?'Не действует':''}</div></article>`}).join('');document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const i=+b.dataset.buy,d=defs[i],price=d[3]*(levels[active][i]+1);if(levels[active][i]>=d[2]||wallet<price)return;wallet-=price;invested[active]+=price;levels[active][i]++;render();$('feedback').textContent='Улучшение куплено · макет';document.querySelector(`[data-buy="${i}"]`).focus();});$('reset').disabled=!invested[active]||wallet+invested[active]<1000;$('reset-note').textContent=!invested[active]?'Нет вложений':wallet+invested[active]<1000?'Золота и возврата меньше 1 000':'Комиссия 1 000 золотых';fit();}
function switchTab(next){tab=next;const u=tab==='upgrades';$('upgrades-tab').setAttribute('aria-selected',u);$('unlocks-tab').setAttribute('aria-selected',!u);$('hero-panel').hidden=!u;$('upgrade-panel').hidden=!u;$('collection').hidden=u;$('reset-group').hidden=!u;$('feedback').textContent='';}
function fit(){const w=+$('resolution').value,h=w*9/16,s=Math.min(1,(innerWidth-24)/w,Math.max(180,innerHeight-$('stage').getBoundingClientRect().top-12)/h);Object.assign($('viewport').style,{width:w+'px',height:h+'px',transform:`scale(${s})`});$('viewport').classList.toggle('compact',w===1280);Object.assign($('stage').style,{width:w*s+'px',height:h*s+'px'});}
document.querySelectorAll('[data-hero]').forEach(b=>b.onclick=()=>{active=+b.dataset.hero;$('feedback').textContent='';render();document.querySelector('.scroll').scrollTop=0;});$('scenario').onchange=seed;$('resolution').onchange=fit;addEventListener('resize',fit);$('disabled-bonuses').onchange=render;$('upgrades-tab').onclick=()=>switchTab('upgrades');$('unlocks-tab').onclick=()=>switchTab('unlocks');$('back').onclick=()=>{$('feedback').textContent='Переход в меню · макет';};$('reset').onclick=()=>{if(!invested[active]||wallet+invested[active]<1000)return;$('reset-description').textContent=heroes[active]+': все улучшения будут сброшены. Остальные герои и открытия сохранятся.';$('refund-value').textContent='+'+fmt(invested[active]);$('after-value').textContent=fmt(wallet+invested[active]-1000);$('confirm').showModal();$('cancel').focus();};$('cancel').onclick=()=>$('confirm').close();$('confirm-reset').onclick=()=>{if(!invested[active]||wallet+invested[active]<1000)return;wallet+=invested[active]-1000;invested[active]=0;levels[active]=Array(12).fill(0);$('confirm').close();render();$('feedback').textContent='Вложения возвращены · макет';};
$('collection').innerHTML='<section><h2>Персонажи</h2><div class="entries"><div class="entry"><img alt="" src="/Assets/Resources/Art/Sprites/Characters/char-002/char-002-body.png"><div>Бугор<small>Открыто</small></div></div><div class="entry"><img alt="" src="/Assets/Resources/Art/Sprites/Characters/char-003/char-003-body.png"><div>Шепотка<small>Открыто</small></div></div></div></section><section><h2>Умения и сеты · за прохождение полей</h2><p class="muted">Пример группы открытого содержимого</p><div class="entries">'+Array.from({length:20},(_,i)=>`<div class="entry"><img alt="" src="/Assets/Resources/Art/UI/Icons/Sets/set-${String(i+1).padStart(3,'0')}-icon.png"><div>${['Тяжёлый боезапас','Возвратный ритм','Грозовой проводник','Ледяной таран','Жадность к знаниям','Полевой медик','Векторный шторм','Утилизатор','Линия пробоя','Холодная орбита','Кинетический арсенал','Неподвижная крепость','Перегрузка сети','Танец клинков','Алхимия хаоса','Выстрел великана','Падающая звезда','Сфера разрушения','Ледяное копьё','Каменное ядро'][i]}<small>Открыто · сет</small></div></div>`).join('')+'</div></section>';seed();
</script></body></html>
