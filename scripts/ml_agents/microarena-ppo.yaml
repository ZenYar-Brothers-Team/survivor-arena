# MicroArena PPO trainer config, matching docs/research/2026-10-01-ml-agents-training-snapshot.md
# (micro-ppo-shaped.yaml): batch 128, buffer 1024, 3 epochs, 128x2 network, horizon 64.
behaviors:
  MicroArena:
    trainer_type: ppo
    hyperparameters:
      batch_size: 128
      buffer_size: 1024
      learning_rate: 0.0003
      learning_rate_schedule: linear
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    max_steps: 60000
    time_horizon: 64
    summary_freq: 3000
