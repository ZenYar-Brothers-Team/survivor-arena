# Stage 2 — moving threat, mixed start distance. The most advanced documented stage: warm-started
# from a mixed-distance checkpoint, it beat straight-line movement by ~35-38 collections out of 200.
# Warm-start from an earlier run's checkpoint with --initialize-from:
#   mlagents-learn scripts/ml_agents/stage-02-moving-threat.yaml --run-id=stage02 --initialize-from=stage01
# then press Play in Assets/Scenes/MLMicroArena.unity.
behaviors:
  MicroArena:
    trainer_type: ppo
    hyperparameters:
      batch_size: 128
      buffer_size: 1024
      learning_rate: 0.0003
      learning_rate_schedule: linear
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    keep_checkpoints: 5
    max_steps: 60000
    time_horizon: 64
    summary_freq: 3000
environment_parameters:
  arena_half_size: 6.0
  player_radius: 0.30
  threat_radius: 0.55
  xp_radius: 0.45
  player_speed: 4.0
  start_x_offset: 2.0
  start_jitter: 0.5
  threat_amplitude: 0.75
  threat_frequency_hz: 0.75
  time_limit_seconds: 2.5
  seed: 700000
